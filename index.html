<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電卓</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Helvetica Neue', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px 16px 12px;
      margin-bottom: 20px;
      text-align: right;
    }

    .expression {
      color: #a0aec0;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      color: #e2e8f0;
      font-size: 40px;
      font-weight: 300;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 20px;
      padding: 18px 0;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      font-weight: 500;
    }

    button:active { transform: scale(0.93); }

    .btn-number {
      background: #1a365d;
      color: #e2e8f0;
    }

    .btn-number:hover { background: #2a4a7f; }

    .btn-operator {
      background: #2b6cb0;
      color: #fff;
    }

    .btn-operator:hover { background: #3182ce; }

    .btn-clear {
      background: #c53030;
      color: #fff;
    }

    .btn-clear:hover { background: #e53e3e; }

    .btn-equal {
      background: #276749;
      color: #fff;
    }

    .btn-equal:hover { background: #38a169; }

    .btn-zero { grid-column: span 2; }

    .btn-sign {
      background: #4a5568;
      color: #e2e8f0;
    }

    .btn-sign:hover { background: #718096; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-sign" onclick="toggleSign()">+/-</button>
      <button class="btn-sign" onclick="percent()">%</button>
      <button class="btn-operator" onclick="setOperator('÷')">÷</button>

      <button class="btn-number" onclick="inputNumber('7')">7</button>
      <button class="btn-number" onclick="inputNumber('8')">8</button>
      <button class="btn-number" onclick="inputNumber('9')">9</button>
      <button class="btn-operator" onclick="setOperator('×')">×</button>

      <button class="btn-number" onclick="inputNumber('4')">4</button>
      <button class="btn-number" onclick="inputNumber('5')">5</button>
      <button class="btn-number" onclick="inputNumber('6')">6</button>
      <button class="btn-operator" onclick="setOperator('−')">−</button>

      <button class="btn-number" onclick="inputNumber('1')">1</button>
      <button class="btn-number" onclick="inputNumber('2')">2</button>
      <button class="btn-number" onclick="inputNumber('3')">3</button>
      <button class="btn-operator" onclick="setOperator('+')">+</button>

      <button class="btn-number btn-zero" onclick="inputNumber('0')">0</button>
      <button class="btn-number" onclick="inputDecimal()">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let previous = null;
    let operator = null;
    let shouldReset = false;

    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = formatNumber(current);
    }

    function formatNumber(num) {
      const n = parseFloat(num);
      if (isNaN(n)) return num;
      if (Math.abs(n) >= 1e12) return n.toExponential(4);
      return n.toLocaleString('ja-JP', { maximumFractionDigits: 10 });
    }

    function inputNumber(n) {
      if (shouldReset) { current = '0'; shouldReset = false; }
      if (current === '0' && n !== '.') current = n;
      else if (current.length < 12) current += n;
      updateDisplay();
    }

    function inputDecimal() {
      if (shouldReset) { current = '0'; shouldReset = false; }
      if (!current.includes('.')) current += '.';
      updateDisplay();
    }

    function setOperator(op) {
      if (operator && !shouldReset) calculate(true);
      previous = current;
      operator = op;
      shouldReset = true;
      expressionEl.textContent = `${formatNumber(previous)} ${op}`;
    }

    function calculate(chained = false) {
      if (!operator || previous === null) return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;
      if (operator === '+') result = a + b;
      else if (operator === '−') result = a - b;
      else if (operator === '×') result = a * b;
      else if (operator === '÷') {
        if (b === 0) { current = 'エラー'; operator = null; updateDisplay(); return; }
        result = a / b;
      }
      if (!chained) expressionEl.textContent = `${formatNumber(previous)} ${operator} ${formatNumber(current)} =`;
      current = String(parseFloat(result.toPrecision(12)));
      operator = null;
      previous = null;
      shouldReset = true;
      updateDisplay();
    }

    function clearAll() {
      current = '0'; previous = null; operator = null; shouldReset = false;
      expressionEl.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      current = String(parseFloat(current) * -1);
      updateDisplay();
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      updateDisplay();
    }

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
      else if (e.key === '.') inputDecimal();
      else if (e.key === '+') setOperator('+');
      else if (e.key === '-') setOperator('−');
      else if (e.key === '*') setOperator('×');
      else if (e.key === '/') { e.preventDefault(); setOperator('÷'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        if (current.length > 1) current = current.slice(0, -1);
        else current = '0';
        updateDisplay();
      }
    });
  </script>
</body>
</html>
