# Netlify 設定ファイル
# ── キャッシュ制御 ──
# HTMLは毎回サーバーへ確認させ、常に最新版を配信する。
# （将来ハッシュ付きの静的ファイルを置く場合は、それらだけ長期キャッシュにする）

[build]
  publish = "."

# すべてのファイル：ブラウザは毎回サーバーに再検証を求める
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTMLは特に厳格に（キャッシュに残さない）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
